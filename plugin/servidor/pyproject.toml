[project]
name = "base-juridica"
version = "0.1.0"
description = "MCP da base jurídica pessoal (leis, precedentes, categorias)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/base_juridica"]

[tool.pytest.ini_options]
addopts = "-m 'not rede'"
markers = ["rede: testes que acessam a internet"]
testpaths = ["tests"]
